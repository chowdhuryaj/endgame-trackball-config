CONFIG_LOG_MAX_LEVEL=3
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=2700000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2700000
CONFIG_POINTER_2S_MIXER_ENSURE_SYNC=y

# AJ twist rules: flash was 99% full; shell tab completion (interactive only,
# Totem-Flask never sends TAB) and shell colours (Flask strips ANSI anyway) are
# dropped to make room for the twist/cursor router.
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_VT100_COLORS=n
